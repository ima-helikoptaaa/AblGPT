# Short CUDA verification run: full-size 12L/768 model on FineWeb-Edu.
# Exercises bf16 autocast, gradient accumulation, checkpoint/resume, and
# validation (currently first evaluated after 501 optimizer updates).
# Effective batch: 2 x 4 x 1024 = 8192 tokens per optimizer update.
n_layers: 12
d_model: 768
d_ff: 2048
n_heads: 12
n_kv_heads: 4
head_dim: 64
seq_len: 1024
n_steps: 600
batch_size: 2
grad_accum_steps: 4
lr: 3.0e-4
warmup_steps: 50
n_val_batches: 5
mix_name: smoke
checkpoint_every: 100
checkpoint_dir: checkpoints/smoke_cuda
dtype: bfloat16
device: cuda
