# Gate 2 (CUDA) — overfit-tiny on the Blackwell box. Same as gate_overfit but
# device=cuda. Use bf16 autocast with fp32 parameters to verify the precision
# path used by the real CUDA training runs.
n_layers: 2
d_model: 128
d_ff: 512
n_heads: 4
n_kv_heads: 2
head_dim: 32
seq_len: 256
n_steps: 1000
batch_size: 4
lr: 3.0e-4
mix_name: smoke
dtype: bfloat16
device: cuda
